services:
  carebridge:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      CAREBRIDGE_API_URL: ${CAREBRIDGE_API_URL:-http://127.0.0.1:${PORT:-3000}}
      BOT_ENABLED: ${BOT_ENABLED:-true}
    restart: unless-stopped
